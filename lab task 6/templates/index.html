<!DOCTYPE html>
<html>
<head>
    <title>Animal Herd Detection</title>
    <style>
        body { font-family: Arial; padding: 20px; background:#f5f5f5; }
        .container { max-width: 800px; margin:auto; }
        img { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; }
        iframe { width: 100%; height: 400px; margin-top:10px; border:1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Animal Herd Detection</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Detect Herd</button>
        </form>

        {% if result_image %}
            <h3>Detected Animals: {{ herd_count }}</h3>
            <img src="{{ result_image }}" alt="Detected Herd">
            <h3>Herd Location (Map Alert)</h3>
            <iframe src="{{ map_file }}"></iframe>
        {% endif %}
    </div>
</body>
</html>
